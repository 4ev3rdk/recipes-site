    <div class="contact">
        <h1>Contact Us</h1>
        <p>If you have any questions, feedback, or recipe suggestions, feel free to reach out to us!</p>

        <form>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" pattern="[A-Za-z\s]+" title="Please enter valid Name"
                required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="message">Feedback:</label><br>
            <textarea id="message" name="message" rows="5" placeholder="Write feedback here !"
                required></textarea><br><br>

            <button type="submit">Send Feedback</button>
        </form>
    </div>

    <div class="footer">


        <p>Connect with us</p>
        <div class=socials>

            <a href="https://youtube.com" target="_blank"> <i class="fa-brands fa-youtube"></i> </a>
